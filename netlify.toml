# Next.js on Netlify (OpenNext adapter is applied automatically)
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Prisma needs the schema at generate/build time
  PRISMA_CLI_BINARY_TARGETS = "native,rhel-openssl-3.0.x"

# Large photo uploads (analyze / create image)
[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
